<!doctype html>
<html lang='en'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Appointments · MediHeal</title>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&family=Outfit:wght@700&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='assets/css/tokens.css'><link rel='stylesheet' href='assets/css/base.css'><link rel='stylesheet' href='assets/css/components.css'><link rel='stylesheet' href='assets/css/pages.css'>
<style>
/* Figma 2027:3041 Reschedule and 2027:3286 Cancel: Action modal 680x568 at (380,252) */
.ap-scrim{position:absolute;left:0;top:0;width:1440px;height:100%;background:rgba(11,42,61,.35);z-index:1000}
.ap-modal{position:fixed;left:50%;margin-left:-340px;top:50%;transform:translateY(-50%);max-height:calc(100dvh - 24px);overflow-y:auto;overflow-x:hidden;width:680px;height:568px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px #c8dcea,0 20px 50px rgba(15,30,46,.25);z-index:1001}
.ap-modal>*{position:absolute}
.ap-x{left:616px;top:24px;width:32px;height:32px;border:0;border-radius:8px;background:#f6fafd;box-shadow:inset 0 0 0 1px #c8dcea;color:#1b4e6b;font:500 18px/30px Inter,sans-serif;padding:0;cursor:pointer}
.ap-t{left:32px;top:28px;font:500 22px/27.5px Lexend,sans-serif;color:#15405a;white-space:nowrap}
.ap-s{left:32px;top:62px;font:400 13px/15.73px Inter,sans-serif;color:#6f8890;white-space:nowrap}
.ap-d{left:32px;top:100px;width:616px;height:1px;background:#e3edf3}
.ap-l{font:600 12px/14.52px Inter,sans-serif;color:#1b4e6b;white-space:nowrap}
.ap-i{height:40px;border-radius:8px;border:0;background:#f6fafd;box-shadow:inset 0 0 0 1px #c8dcea;padding:0 14px;font:500 13px/40px Inter,sans-serif;color:#1c2b30;outline:0;margin:0;box-sizing:border-box}
textarea.ap-i{height:88px;padding:12px 14px;line-height:20px;resize:none;font-family:Inter,sans-serif}
.ap-i:focus{box-shadow:inset 0 0 0 1px #1c6d9c}
.ap-i[readonly]{color:#1c2b30}
.ap-c,.ap-ok{top:504px;height:40px;border-radius:8px;border:0;padding:0;font:600 13px/15.73px Inter,sans-serif;cursor:pointer}
.ap-c{left:396px;width:100px;background:#fff;box-shadow:inset 0 0 0 1px #c8dcea;color:#1b4e6b}
.ap-ok{left:508px;width:140px;background:#1c6d9c;color:#fff}
.ap-ok.red{background:#c0392b}
</style>
<link rel='stylesheet' href='assets/css/responsive.css'></head><body data-page='appointments'>
<!-- Figma: Appointments 23:2289 (frame origin 4800,34000). New Appointment / Walk-In opens appointment-form.html (Figma 248:821). The Edit modal below is still temporary: Figma has no edit screen. -->
<div class='stage'>
  <div id='kpis'></div>
  <h1 class='a-title'>Appointments</h1>
  <div class='a-controls'>
    <div class='a-search'><span id='sicon'></span><input id='q' type='search' placeholder='Search patients, doctors...' aria-label='Search appointments'></div>
    <div class='a-dd' id='dd-stat' style='width:114px'></div>
    <div class='a-dd' id='dd-doc' style='width:147px'></div>
    <button class='a-new' id='new'><span id='picon'></span>New Appointment / Walk-In</button>
  </div>
  <section class='a-table'>
    <div class='a-grid a-th'><span>PATIENT NAME</span><span>DATE &amp; TIME</span><span>APPOINTMENT TYPE</span><span>DOCTOR</span><span>STATUS</span><span>ACTIONS</span></div>
    <div id='rows'></div>
    <div class='a-foot'><span id='count'></span>
      <div class='a-pages' id='pages'></div>
    </div>
  </section>
</div>
<script src='assets/js/data.js'></script><script src='assets/js/store.js'></script><script src='assets/js/audit.js'></script><script src='assets/js/kit.js'></script><script src='assets/js/data-records.js'></script><script src='assets/js/data-departments.js'></script><script src='assets/js/data-billing.js'></script><script src='assets/js/ledger.js'></script><script src='assets/js/tariffs.js'></script><script src='assets/js/encounters.js'></script><script src='assets/js/charges.js'></script><script src='assets/js/lab.js'></script><script src='assets/js/pharmacy.js'></script><script src='assets/js/claims.js'></script><script src='assets/js/admissions.js'></script><script src='assets/js/data-attendance.js'></script><script src='assets/js/registry.js'></script><script src='assets/js/icons.js'></script><script src='assets/js/ui.js'></script><script src='assets/js/accounts.js'></script><script src='assets/js/auth.js'></script><script src='assets/js/rbac.js'></script><script src='assets/js/deeplink.js'></script><script src='assets/js/shell.js'></script>
<script>
const $ = id => document.getElementById(id);
// Appointments saved by appointment-form.html (session key mh_appts_extra via HIS.store, same tab).
HIS.store.get('mh_appts_extra', []).forEach(r => HIS.appointments.push(r));
// Edits are stored by appointment id. Before this, a status change only mutated the array in memory,
// so it vanished on reload and no other account ever saw it.
const APPT_STATE = 'mh_appt_state';
const apptEdits = HIS.store.get(APPT_STATE, {});
HIS.appointments = HIS.appointments.map(a => Object.assign({}, a, (a.id && apptEdits[a.id]) || {}));
function saveApptEdit(a, patch) {
  if (!a || !a.id) return;
  const all = HIS.store.get(APPT_STATE, {});
  all[a.id] = Object.assign({}, all[a.id] || {}, patch);
  HIS.store.set(APPT_STATE, all);
  if (window.HIS.audit) HIS.audit.append({ who: 'Appointments', role: 'Front desk',
    what: 'Appointment ' + a.id + ' ' + (a.patient || '') + ' — ' + Object.keys(patch).join(', ') + ' updated',
    entity: 'appointment:' + a.id, before: a.status || '', after: patch.status || '' });
}
$('sicon').innerHTML = svg('search', 16);
$('picon').innerHTML = svg('plus', 16);
// [label, value, icon, icon bg, icon color, width, height, left]
// The five cards are the Figma layout. Their VALUES are counted from HIS.appointments on every
// render, never typed in, so cancelling an appointment moves the numbers. "Walk-in" was a Figma
// placeholder with no record behind it — a walk-in is not distinguishable from a booked visit in
// this dataset — so that card reports Completed, which is a real status here.
const K = [
  ['Total Appointments', 'total', 'calendar-check', '#dbeafe', '#2563eb', 224, 126, 148],
  ['Confirmed', 'Confirmed', 'check-circle', '#d1fae5', '#10b981', 197, 126, 392],
  ['Pending Approval', 'Pending', 'clock', '#fef3c7', '#f59e0b', 232, 126, 609],
  ['Cancelled', 'Cancelled', 'x-circle', '#fee2e2', '#ef4444', 194, 126, 861],
  ['Completed', 'Completed', 'person-circle', '#1e293b', '#ffffff', 183, 126, 1075]
];
function kpiCount(key) {
  const list = HIS.appointments;
  return String(key === 'total' ? list.length : list.filter(a => a.status === key).length);
}
function paintKpis() {
  $('kpis').innerHTML = K.map(k => "<div class='akpi' style='left:" + k[7] + 'px;width:' + k[5] + 'px;height:' + k[6] + "px'><div class='at'><span>" + k[0] + "</span><i style='background:" + k[3] + ';color:' + k[4] + "'>" + svg(k[2], 20) + "</i></div><div class='aval'>" + kpiCount(k[1]) + '</div></div>').join('');
}

const PAGE = 8;
// A notification can arrive here asking for a status, e.g. 'appointments.html?status=Pending'.
const wantStatus = HIS.deepLink ? HIS.deepLink.param('status') : null;
const state = { q: '', stat: (wantStatus && HIS.apptStatuses.indexOf(wantStatus) > -1) ? wantStatus : 'Status: All', doc: 'Doctor: All Drs.', page: 1 };
if (wantStatus) HIS.deepLink.clear('status');
makeDropdown($('dd-stat'), { options: ['Status: All', ...HIS.apptStatuses], value: state.stat, onChange: v => { state.stat = v; state.page = 1; render(); } });
makeDropdown($('dd-doc'), { options: ['Doctor: All Drs.', ...HIS.doctors], onChange: v => { state.doc = v; state.page = 1; render(); } });
document.querySelectorAll('.a-dd').forEach(d => d.classList.add('light'));

function filtered() {
  const q = state.q.trim().toLowerCase();
  return HIS.appointments.map((a, i) => Object.assign({}, a, { i })).filter(a =>
    (state.stat === 'Status: All' || a.status === state.stat) &&
    (state.doc === 'Doctor: All Drs.' || a.doctor === state.doc) &&
    (!q || (a.patient + ' ' + a.doctor + ' ' + a.kind).toLowerCase().includes(q)));
}

function render() {
  paintKpis();
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;
  const from = (state.page - 1) * PAGE;
  const slice = list.slice(from, from + PAGE);

  $('rows').innerHTML = slice.length ? slice.map(a =>
    "<div class='a-grid a-row' data-id='" + (a.id || 'APT-' + String(a.i + 1).padStart(4, '0')) + "'><span class='nm'>" + a.patient + '</span><span>' + a.when + "</span><span class='ty'>" + a.kind + '</span><span>' + a.doctor + '</span>' +
    "<span><span class='a-pill " + a.status + "'>" + a.status + '</span></span>' +
    "<span class='a-act'><button class='a-ib' data-edit='" + a.i + "' aria-label='Edit appointment for " + a.patient + "'>" + svg('edit', 16) + "</button><button class='a-ib' data-more='" + a.i + "' aria-label='More actions'>" + svg('more', 16) + '</button></span></div>').join('')
    : "<div class='empty'>" + (HIS.appointments.length ? 'No appointments match these filters.' : 'No appointments booked yet.') + '</div>';

  $('count').textContent = list.length
    ? 'Showing ' + (from + 1) + '\u2013' + (from + slice.length) + ' of ' + list.length + ' appointment' + (list.length === 1 ? '' : 's')
    : 'No appointments to show';

  // Real page controls: they only appear when there is more than one page of results.
  const p = $('pages');
  if (pages < 2) { p.innerHTML = ''; return; }
  let h = "<button data-p='" + (state.page - 1) + "'" + (state.page === 1 ? ' disabled' : '') + " aria-label='Previous page'>&lsaquo;</button>";
  for (let i = 1; i <= pages; i++) h += "<button data-p='" + i + "'" + (i === state.page ? " class='on'" : '') + '>' + i + '</button>';
  h += "<button data-p='" + (state.page + 1) + "'" + (state.page === pages ? ' disabled' : '') + " aria-label='Next page'>&rsaquo;</button>";
  p.innerHTML = h;
}
$('pages').onclick = e => {
  const b = e.target.closest('button[data-p]');
  if (!b || b.disabled) return;
  state.page = +b.dataset.p;
  render();
};

function toInputs(when) {
  const parts = when.split(' \u2022 ');
  const dt = new Date(parts[0] + ' ' + parts[1]);
  const p = n => String(n).padStart(2, '0');
  return { date: dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()), time: p(dt.getHours()) + ':' + p(dt.getMinutes()) };
}
// The patient is chosen from the registry rather than typed, so an appointment cannot be filed
// against a name that exists nowhere else. Existing appointment names are kept in the list so the
// seeded records still resolve.
function patientOptions(current) {
  const set = [];
  HIS.patients.forEach(p => { if (p.name && !set.includes(p.name)) set.push(p.name); });
  HIS.appointments.forEach(a => { if (a.patient && !set.includes(a.patient)) set.push(a.patient); });
  if (current && !set.includes(current)) set.unshift(current);
  return set;
}
function form(a) {
  a = a || {};
  openModal({
    title: a.patient ? 'Edit Appointment' : 'New Appointment / Walk-In', sub: 'Update the details below and save to keep the appointment.',
    saveLabel: a.patient ? 'Save changes' : 'Create',
    body: "<label>Patient</label><select name='patient' required>" + opts(patientOptions(a.patient), a.patient) + '</select>' +
      "<div class='row'><div><label>Date</label><input name='date' type='date' required value='" + (a.date || '2026-08-31') + "'></div><div><label>Time</label><input name='time' type='time' required value='" + (a.time || '09:00') + "'></div></div>" +
      "<label>Type</label><select name='kind'>" + opts(HIS.apptKinds, a.kind) + '</select>' +
      "<div class='row'><div><label>Doctor</label><select name='doctor'>" + opts(HIS.doctors, a.doctor) + "</select></div><div><label>Status</label><select name='status'>" + opts(HIS.apptStatuses, a.status || 'Pending') + '</select></div></div>',
    onSave: d => {
      const dt = new Date(d.date + 'T' + d.time);
      const rec = { patient: d.patient, kind: d.kind, doctor: d.doctor, status: d.status, date: d.date, time: d.time,
        when: HIS.fmtShort(dt) + ' \u2022 ' + dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) };
      if (a.i != null) {
        const id = HIS.appointments[a.i].id;
        HIS.appointments[a.i] = Object.assign({}, rec, { id: id });
        saveApptEdit(HIS.appointments[a.i], rec);
      } else {
        const created = Object.assign({ id: 'APT-' + Date.now().toString().slice(-6) }, rec);
        HIS.appointments.push(created);
        const extra = HIS.store.get('mh_appts_extra', []);
        extra.push(created); HIS.store.set('mh_appts_extra', extra);
        saveApptEdit(created, rec);
      }
      render();
    }
  });
}

$('q').oninput = e => { state.q = e.target.value; state.page = 1; render(); };
$('new').onclick = () => { location.href = 'appointment-form.html'; };
$('rows').onclick = e => {
  const ed = e.target.closest('[data-edit]');
  const mo = e.target.closest('[data-more]');
  document.querySelectorAll('.a-menu').forEach(m => m.remove());
  if (ed) { const i = +ed.dataset.edit; const a = HIS.appointments[i]; form(Object.assign({ i }, a, a.date ? {} : toInputs(a.when))); }
  if (mo) {
    e.stopPropagation();
    const i = +mo.dataset.more;
    const menu = document.createElement('div');
    menu.className = 'a-menu';
    menu.innerHTML = "<button data-r='1'>Reschedule</button><button data-s='Completed'>Mark completed</button><button data-x='1'>Cancel appointment</button>";
    menu.onclick = ev => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.r) { actionModal('res', i); menu.remove(); return; }
      if (b.dataset.x) { actionModal('can', i); menu.remove(); return; }
      HIS.appointments[i].status = b.dataset.s;
      saveApptEdit(HIS.appointments[i], { status: b.dataset.s });   // the row menu must persist too
      render();
    };
    mo.closest('.a-act').appendChild(menu);
  }
};
document.addEventListener('click', () => document.querySelectorAll('.a-menu').forEach(m => m.remove()));

function closeAp() { document.querySelectorAll('.ap-layer').forEach(n => n.remove()); }
function actionModal(kind, i) {
  closeAp();
  const a = HIS.appointments[i] || {};
  const it = a.date && a.time ? { date: a.date, time: a.time } : toInputs(a.when || 'Aug 31, 2026 \u2022 09:00 AM');
  const res = kind === 'res';
  const field = (l, t, w, left, inner) => "<div class='ap-l' style='left:" + left + 'px;top:' + t + "px'>" + l + '</div>' + inner.replace('{ST}', "style='left:" + left + 'px;top:' + (t + 22) + 'px;width:' + w + "px'");
  const layer = document.createElement('div');
  layer.className = 'ap-layer';
  layer.innerHTML = "<div class='ap-scrim' data-close></div><div class='ap-modal'>" +
    "<button class='ap-x' data-close aria-label='Close'>\u00d7</button>" +
    "<div class='ap-t'>" + (res ? 'Reschedule appointment' : 'Cancel appointment') + "</div>" +
    "<div class='ap-s'>" + (res ? 'Move this appointment to a new date, time or doctor' : 'This frees the slot and notifies the patient') + "</div>" +
    "<div class='ap-d'></div>" +
    field('Patient', 120, 300, 32, "<input class='ap-i' readonly {ST} value='" + HIS.kit.esc(a.patient || '') + "'>") +
    field('Doctor', 120, 300, 348, res
      ? "<select class='ap-i' name='doctor' {ST}>" + HIS.doctors.map(d => "<option" + (d === a.doctor ? ' selected' : '') + '>' + d + '</option>').join('') + '</select>'
      : "<input class='ap-i' readonly {ST} value='" + HIS.kit.esc(a.doctor || '') + "'>") +
    (res ? field('New date', 202, 300, 32, "<input class='ap-i' type='date' name='date' {ST} value='" + it.date + "'>") +
           field('New time', 202, 300, 348, "<input class='ap-i' type='time' name='time' {ST} value='" + it.time + "'>") +
           field('Reason for rescheduling', 284, 616, 32, "<input class='ap-i' name='reason' {ST} value='Doctor unavailable at the original time'>") +
           field('Message to patient', 366, 616, 32, "<textarea class='ap-i' name='msg' {ST}>Your appointment has been moved. Please arrive 15 minutes early.</textarea>")
         : field('Cancelled by', 202, 300, 32, "<input class='ap-i' name='by' {ST} value='Front desk'>") +
           field('Notify patient', 202, 300, 348, "<input class='ap-i' name='notify' {ST} value='SMS and email'>") +
           field('Reason for cancelling', 284, 616, 32, "<input class='ap-i' name='reason' {ST} value='Patient requested cancellation'>") +
           field('Notes', 366, 616, 32, "<textarea class='ap-i' name='notes' {ST}>Offer the patient a new slot when they call back.</textarea>")) +
    "<button class='ap-c' data-close>" + (res ? 'Cancel' : 'Go back') + "</button>" +
    "<button class='ap-ok" + (res ? '' : ' red') + "'>" + (res ? 'Confirm reschedule' : 'Cancel appointment') + "</button></div>";
  document.querySelector('.stage').appendChild(layer);
  layer.onclick = ev => { if (ev.target.closest('[data-close]') || ev.target.classList.contains('ap-scrim')) closeAp(); };
  layer.querySelector('.ap-ok').onclick = () => {
    if (res) {
      const d = layer.querySelector('[name=date]').value, t = layer.querySelector('[name=time]').value;
      if (!d || !t) return;
      const dt = new Date(d + 'T' + t);
      const patch = {
        date: d, time: t, doctor: layer.querySelector('[name=doctor]').value,
        when: HIS.fmtShort(dt) + ' • ' + dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      };
      Object.assign(HIS.appointments[i], patch);
      saveApptEdit(HIS.appointments[i], patch);
    } else {
      HIS.appointments[i].status = 'Cancelled';
      saveApptEdit(HIS.appointments[i], { status: 'Cancelled' });
    }
    closeAp(); render();
  };
  document.addEventListener('keydown', function esc(ev) { if (ev.key === 'Escape') { closeAp(); document.removeEventListener('keydown', esc); } });
}
render();
</script>
</body></html>
